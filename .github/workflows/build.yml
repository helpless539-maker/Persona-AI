
name: Build Persona AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q persona_ai_android_source.zip

      - name: Build APK
        run: gradle -p persona_ai_android_project assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Persona-AI-APK
          path: persona_ai_android_project/app/build/outputs/apk/debug/app-debug.apk
